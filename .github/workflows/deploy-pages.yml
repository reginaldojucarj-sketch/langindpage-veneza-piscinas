name: Deploy static landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Reject non-public articles in static snapshots
        run: node --test tests/public-posts.test.cjs
      - name: Verify canonical landing URLs
        run: node --test tests/landing-seo.test.cjs
      - name: Verify public snapshot generator
        shell: pwsh
        run: ./tests/build-posts-data.test.ps1
      - name: Stage only public static files
        run: |
          mkdir -p _pages/assets
          cp index.html posts.html font-showcase.html robots.txt sitemap.xml _pages/
          cp -R assets/css assets/data assets/images assets/js assets/videos _pages/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
