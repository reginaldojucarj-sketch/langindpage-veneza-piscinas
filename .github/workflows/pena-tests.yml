name: PENA and site tests

on:
  push:
    paths:
      - 'PENA/**'
      - 'site/**'
      - 'assets/data/posts-data.js'
      - 'assets/js/posts.js'
      - 'scripts/build-posts-data.ps1'
      - 'scripts/export-posts.sql'
      - 'tests/public-posts.test.cjs'
      - 'tests/build-posts-data.test.ps1'
      - 'scripts/prepare-pena-release.ps1'
      - '.github/workflows/pena-tests.yml'
  pull_request:
    paths:
      - 'PENA/**'
      - 'site/**'
      - 'assets/data/posts-data.js'
      - 'assets/js/posts.js'
      - 'scripts/build-posts-data.ps1'
      - 'scripts/export-posts.sql'
      - 'tests/public-posts.test.cjs'
      - 'tests/build-posts-data.test.ps1'
      - 'scripts/prepare-pena-release.ps1'
      - '.github/workflows/pena-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies in isolated PHP container
        run: docker run --rm -v "$PWD/PENA:/app" -w /app composer:2 composer install --no-interaction --prefer-dist
      - name: Build PHP image with GD and EXIF for isolated tests
        run: docker build -t pena-access-tests PENA
      - name: Unit and HTTP integration tests (SQLite in memory only)
        run: docker run --rm --network none -v "$PWD/PENA:/app" -w /app pena-access-tests php vendor/bin/phpunit
      - name: Validate protected OpenAPI document
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD/PENA:/app:ro" -w /app pena-access-tests php scripts/export-openapi.php > "$RUNNER_TEMP/pena-openapi.json"
          docker run --rm -v "$PWD/PENA/tools/openapi:/work" -w /work node:22-alpine npm ci --ignore-scripts --no-audit --no-fund
          docker run --rm --network none -v "$PWD/PENA/tools/openapi:/work:ro" -v "$RUNNER_TEMP/pena-openapi.json:/spec.json:ro" -w /work node:22-alpine node validate.cjs /spec.json
      - name: Browser smoke test for protected Swagger (synthetic SQLite only)
        shell: bash
        run: bash PENA/tests/Browser/run-ci.sh
      - name: Site article SSR and browser smoke tests (synthetic API only)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD/site:/site:ro" -w /site pena-access-tests sh tests/run-http.sh
          bash site/tests/run-browser-ci.sh
      - name: Last administrator protection (synthetic MariaDB, no network)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pena-access-ci --network none --tmpfs /var/lib/mysql:rw,size=256m \
            -v pena-access-ci-socket:/run/mysqld -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
            -e MARIADB_DATABASE=pena_access_test mariadb:10.11.19 --skip-networking
          trap 'docker rm -f pena-access-ci; docker volume rm pena-access-ci-socket' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec pena-access-ci mariadb --protocol=socket -uroot pena_access_test -e 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker run --rm --network none -v "$PWD/PENA:/app:ro" -v pena-access-ci-socket:/run/mysqld -w /app \
            -e APP_ENV=testing -e DB_CONNECTION=mysql -e DB_HOST=localhost -e DB_DATABASE=pena_access_test \
            -e DB_USERNAME=root -e DB_PASSWORD= -e DB_URL= -e DB_SOCKET=/run/mysqld/mysqld.sock \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e PENA_SYNTHETIC_ACCESS_TEST=1 \
            pena-access-tests php tests/Integration/admin-access-mariadb.php
      - name: Editorial ordering and rollback (synthetic MariaDB, no network)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pena-editorial-ci --network none --tmpfs /var/lib/mysql:rw,size=256m \
            -v pena-editorial-ci-socket:/run/mysqld -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
            -e MARIADB_DATABASE=pena_editorial_test mariadb:10.11.19 --skip-networking
          trap 'docker rm -f pena-editorial-ci; docker volume rm pena-editorial-ci-socket' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec pena-editorial-ci mariadb --protocol=socket -uroot pena_editorial_test -e 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker run --rm --network none -v "$PWD/PENA:/app:ro" -v pena-editorial-ci-socket:/run/mysqld -w /app \
            -e APP_ENV=testing -e DB_CONNECTION=mysql -e DB_HOST=localhost -e DB_DATABASE=pena_editorial_test \
            -e DB_USERNAME=root -e DB_PASSWORD= -e DB_URL= -e DB_SOCKET=/run/mysqld/mysqld.sock \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e PENA_SYNTHETIC_EDITORIAL_TEST=1 \
            pena-access-tests php tests/Integration/editorial-order-mariadb.php
      - name: Author snapshots and media uniqueness (synthetic MariaDB, no network)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pena-content-ci --network none --tmpfs /var/lib/mysql:rw,size=256m \
            -v pena-content-ci-socket:/run/mysqld -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
            -e MARIADB_DATABASE=pena_content_test mariadb:10.11.19 --skip-networking
          trap 'docker rm -f pena-content-ci; docker volume rm pena-content-ci-socket' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec pena-content-ci mariadb --protocol=socket -uroot pena_content_test -e 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker run --rm --network none -v "$PWD/PENA:/app:ro" -v pena-content-ci-socket:/run/mysqld -w /app \
            -e APP_ENV=testing -e DB_CONNECTION=mysql -e DB_HOST=localhost -e DB_DATABASE=pena_content_test \
            -e DB_USERNAME=root -e DB_PASSWORD= -e DB_URL= -e DB_SOCKET=/run/mysqld/mysqld.sock \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e PENA_SYNTHETIC_CONTENT_TEST=1 \
            pena-access-tests php tests/Integration/author-media-mariadb.php
      - name: Post editing and MyISAM refusal (synthetic MariaDB, no network)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pena-posts-ci --network none --tmpfs /var/lib/mysql:rw,size=256m \
            -v pena-posts-ci-socket:/run/mysqld -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
            -e MARIADB_DATABASE=pena_posts_test mariadb:10.11.19 --skip-networking
          trap 'docker rm -f pena-posts-ci; docker volume rm pena-posts-ci-socket' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec pena-posts-ci mariadb --protocol=socket -uroot pena_posts_test -e 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker run --rm --network none -v "$PWD/PENA:/app:ro" -v pena-posts-ci-socket:/run/mysqld -w /app \
            -e APP_ENV=testing -e DB_CONNECTION=mysql -e DB_HOST=localhost -e DB_DATABASE=pena_posts_test \
            -e DB_USERNAME=root -e DB_PASSWORD= -e DB_URL= -e DB_SOCKET=/run/mysqld/mysqld.sock \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e LOG_CHANNEL=stderr -e PENA_SYNTHETIC_POSTS_TEST=1 \
            pena-access-tests php tests/Integration/post-editor-mariadb.php
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static site contract and admin interaction tests
        run: docker run --rm --network none -v "$PWD:/app:ro" -w /app node:22-alpine node --test tests/public-posts.test.cjs site/tests/content.test.cjs PENA/tests/js/admin-order.test.cjs PENA/tests/js/admin-media.test.cjs PENA/tests/js/admin-post-media.test.cjs PENA/tests/js/api-docs.test.cjs
      - name: Verify public snapshot generator
        shell: pwsh
        run: ./tests/build-posts-data.test.ps1
