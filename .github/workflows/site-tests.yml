name: Institutional site tests

on:
  push:
    paths:
      - 'site/**'
      - 'assets/data/posts-data.js'
      - 'assets/js/posts.js'
      - 'scripts/build-posts-data.ps1'
      - 'scripts/export-posts.sql'
      - 'scripts/deploy-servhost-site.py'
      - 'tests/**'
      - '.github/workflows/site-tests.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'assets/data/posts-data.js'
      - 'assets/js/posts.js'
      - 'scripts/build-posts-data.ps1'
      - 'scripts/export-posts.sql'
      - 'scripts/deploy-servhost-site.py'
      - 'tests/**'
      - '.github/workflows/site-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public content and JavaScript
        run: |
          node --test tests/public-posts.test.cjs site/tests/content.test.cjs
          for script in site/assets/js/*.js; do node --check "$script"; done
      - name: Validate publication scope
        run: |
          python3 -m unittest discover -s tests -p 'test_servhost_deploy.py' -v
          python3 scripts/deploy-servhost-site.py --validate-only
      - name: Verify public snapshot generator
        shell: pwsh
        run: ./tests/build-posts-data.test.ps1
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build independent site test images
        run: |
          docker build -t site-php-tests -f site/tests/PHP.Dockerfile site/tests
          docker build -t site-browser-tests site/tests/Browser
      - name: PHP contracts and HTTP routes with a synthetic API
        run: docker run --rm --network none -v "$PWD/site:/site:ro" -w /site site-php-tests sh tests/run-http.sh
      - name: Article browser tests and mobile/tablet regression
        run: bash site/tests/run-browser-ci.sh
